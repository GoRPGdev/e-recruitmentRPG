<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<title>e-Recruitment RPG</title>
<style>
:root{
  --bg:#f5f7f4; --surface:#ffffff; --surface-2:#eceff0e6; --surface-2:#ecefe9; --surface-3:#e3e7dd;
  --border:#d6dbcf; --border-strong:#c3cabb;
  --text:#1b211c; --text-muted:#59635b; --text-faint:#8a938a;
  --accent:#1f6f5c; --accent-ink:#124034; --accent-soft:#e3f0ea; --accent-contrast:#ffffff;
  --good:#2f7d4f; --good-soft:#e2f0e5;
  --warn:#8f6410; --warn-soft:#f6ecd6;
  --crit:#b23b3b; --crit-soft:#f6e1df;
  --info:#3a6ea5; --info-soft:#e2ecf5;
  --hold:#7c6316; --hold-soft:#f3ecd3;
  --talent:#6b4fa0; --talent-soft:#ece4f6;
  --shadow-sm:0 1px 2px rgba(20,30,25,.06);
  --shadow:0 1px 2px rgba(20,30,25,.06),0 10px 26px rgba(20,30,25,.07);
  --radius:12px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111512; --surface:#191d18; --surface-2:#20251f; --surface-3:#2a3028;
    --border:#333a32; --border-strong:#414a3f;
    --text:#e7ebe4; --text-muted:#9ba79c; --text-faint:#717d72;
    --accent:#4bb89d; --accent-ink:#bfeadd; --accent-soft:#183129; --accent-contrast:#07130f;
    --good:#5bb47e; --good-soft:#16301f;
    --warn:#d0a04e; --warn-soft:#332a16;
    --crit:#e08585; --crit-soft:#3a201f;
    --info:#7aa9d6; --info-soft:#182a38;
    --hold:#d8b866; --hold-soft:#322a15;
    --talent:#b6a0e0; --talent-soft:#241c33;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.38);
  }
}
:root[data-theme="dark"]{
  --bg:#111512; --surface:#191d18; --surface-2:#20251f; --surface-3:#2a3028;
  --border:#333a32; --border-strong:#414a3f;
  --text:#e7ebe4; --text-muted:#9ba79c; --text-faint:#717d72;
  --accent:#4bb89d; --accent-ink:#bfeadd; --accent-soft:#183129; --accent-contrast:#07130f;
  --good:#5bb47e; --good-soft:#16301f;
  --warn:#d0a04e; --warn-soft:#332a16;
  --crit:#e08585; --crit-soft:#3a201f;
  --info:#7aa9d6; --info-soft:#182a38;
  --hold:#d8b866; --hold-soft:#322a15;
  --talent:#b6a0e0; --talent-soft:#241c33;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.38);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:"Archivo",system-ui,sans-serif; margin:0; line-height:1.2; text-wrap:balance; color:var(--text)}
h1{font-size:24px; font-weight:700}
h2{font-size:18px; font-weight:600}
h3{font-size:15px; font-weight:600}
p{margin:0}
a{color:var(--accent); text-decoration:none}
button{font-family:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-family:"Archivo",sans-serif; font-size:10.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--text-faint)}
.muted{color:var(--text-muted)}
.faint{color:var(--text-faint)}
::selection{background:var(--accent-soft); color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}

/* ---------- shell ---------- */
#app{display:grid; grid-template-columns:250px 1fr; min-height:100vh}
.sidebar{
  background:var(--surface); border-right:1px solid var(--border);
  position:sticky; top:0; height:100vh; overflow:auto; padding:16px 12px; z-index:40;
}
.brand{display:flex; align-items:center; gap:9px; padding:6px 8px 14px}
.brand-mark{width:30px; height:30px; border-radius:8px; background:var(--accent); color:var(--accent-contrast);
  display:grid; place-items:center; font-family:"Archivo"; font-weight:700; font-size:14px; flex:none}
.brand-name{font-family:"Archivo"; font-weight:700; font-size:14px; letter-spacing:.02em}
.brand-sub{font-size:10.5px; color:var(--text-faint); letter-spacing:.03em}
.nav-group{margin-top:14px}
.nav-group > .eyebrow{padding:0 8px 6px}
.nav-item{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  padding:8px 9px; border-radius:9px; border:1px solid transparent; background:none;
  color:var(--text-muted); font-size:13px; font-weight:500; cursor:pointer;
}
.nav-item:hover{background:var(--surface-2); color:var(--text)}
.nav-item.active{background:var(--accent-soft); color:var(--accent-ink); border-color:color-mix(in srgb,var(--accent) 22%,transparent)}
.nav-item .ic{width:16px; text-align:center; flex:none; opacity:.9}
.nav-item .badge-count{margin-left:auto; font-size:11px; background:var(--surface-3); color:var(--text-muted); border-radius:999px; padding:0 6px; min-width:18px; text-align:center}

.main{display:flex; flex-direction:column; min-width:0}
.topbar{
  position:sticky; top:0; z-index:30; background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(6px); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:14px; padding:10px 20px;
}
.menu-btn{display:none}
.env-pill{font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  color:var(--warn); background:var(--warn-soft); border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);
  padding:3px 8px; border-radius:6px}
.topbar-spacer{flex:1}
.role-switch{display:flex; gap:2px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:3px}
.role-switch button{
  border:0; background:none; padding:5px 10px; border-radius:7px; font-size:12px; font-weight:600;
  color:var(--text-muted); cursor:pointer; white-space:nowrap;
}
.role-switch button.active{background:var(--surface); color:var(--text); box-shadow:var(--shadow-sm)}
.icon-btn{width:32px; height:32px; border-radius:8px; border:1px solid var(--border); background:var(--surface);
  color:var(--text-muted); cursor:pointer; display:grid; place-items:center; font-size:14px}
.icon-btn:hover{color:var(--text); border-color:var(--border-strong)}

.view{padding:24px; width:100%; max-width:1160px; margin:0 auto}
.view.wide{max-width:none}
.page-head{display:flex; align-items:flex-start; gap:16px; margin-bottom:20px; flex-wrap:wrap}
.page-head .grow{flex:1; min-width:220px}
.page-head h1{margin-bottom:4px}
.page-head .sub{color:var(--text-muted); font-size:13px}

/* ---------- primitives ---------- */
.btn{display:inline-flex; align-items:center; gap:6px; padding:8px 13px; border-radius:9px;
  border:1px solid var(--border-strong); background:var(--surface); color:var(--text);
  font-size:13px; font-weight:600; cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn--primary{background:var(--accent); border-color:var(--accent); color:var(--accent-contrast)}
.btn--primary:hover{background:var(--accent-ink)}
.btn--ghost{border-color:transparent; background:none; color:var(--text-muted)}
.btn--ghost:hover{background:var(--surface-2); color:var(--text)}
.btn--sm{padding:5px 9px; font-size:12px; border-radius:7px}
.btn--danger{color:var(--crit); border-color:color-mix(in srgb,var(--crit) 35%,transparent)}
.btn[disabled]{opacity:.5; cursor:not-allowed}

.tag{display:inline-flex; align-items:center; gap:4px; font-family:"Archivo",sans-serif;
  font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px;
  background:var(--surface-3); color:var(--text-muted); border:1px solid transparent; white-space:nowrap}
.tag .dot{width:6px; height:6px; border-radius:50%; background:currentColor}
.tag--good{background:var(--good-soft); color:var(--good)}
.tag--warn{background:var(--warn-soft); color:var(--warn)}
.tag--crit{background:var(--crit-soft); color:var(--crit)}
.tag--info{background:var(--info-soft); color:var(--info)}
.tag--hold{background:var(--hold-soft); color:var(--hold)}
.tag--talent{background:var(--talent-soft); color:var(--talent)}
.tag--accent{background:var(--accent-soft); color:var(--accent-ink)}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-sm)}
.card-pad{padding:16px}
.grid{display:grid; gap:16px}
.cols-2{grid-template-columns:repeat(2,1fr)}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-4{grid-template-columns:repeat(4,1fr)}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.between{display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap}

.stat{padding:15px 16px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius)}
.stat .k{font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--text-faint); font-family:"Archivo"; font-weight:600}
.stat .v{font-family:"Archivo"; font-weight:700; font-size:26px; margin-top:6px; font-variant-numeric:tabular-nums}
.stat .d{font-size:11.5px; color:var(--text-muted); margin-top:2px}

table.tbl{width:100%; border-collapse:collapse}
.tbl th{font-family:"Archivo"; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em;
  color:var(--text-faint); text-align:left; padding:9px 10px; border-bottom:1px solid var(--border); font-weight:600}
.tbl td{padding:10px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:default}
.tbl tbody tr.clickable{cursor:pointer}
.tbl tbody tr.clickable:hover td{background:var(--surface-2)}
.tbl-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface)}

.field{display:flex; flex-direction:column; gap:5px; margin-bottom:12px}
.field label{font-family:"Archivo"; font-size:11px; font-weight:600; letter-spacing:.03em; color:var(--text-muted)}
.field input,.field select,.field textarea{
  font-family:inherit; font-size:13px; padding:8px 10px; border-radius:8px;
  border:1px solid var(--border-strong); background:var(--surface); color:var(--text); width:100%}
.field textarea{resize:vertical; min-height:64px}
.field .hint{font-size:11px; color:var(--text-faint)}
.field.check{flex-direction:row; align-items:flex-start; gap:8px}
.field.check input{width:auto; margin-top:2px}
.field.check label{font-family:"IBM Plex Sans"; font-weight:400; font-size:12.5px; color:var(--text)}
.form-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:0 16px}
.form-grid .full{grid-column:1/-1}

.callout{display:flex; gap:10px; padding:12px 14px; border-radius:10px; background:var(--accent-soft);
  border:1px solid color-mix(in srgb,var(--accent) 20%,transparent); font-size:12.5px; color:var(--accent-ink)}
.callout--warn{background:var(--warn-soft); border-color:color-mix(in srgb,var(--warn) 28%,transparent); color:var(--warn)}
.callout .ic{flex:none}

.kv{display:grid; grid-template-columns:130px 1fr; gap:7px 12px; font-size:13px}
.kv dt{color:var(--text-faint); font-size:12px}
.kv dd{margin:0}

/* ---------- kanban ---------- */
.kanban{display:flex; gap:12px; overflow-x:auto; padding:4px 2px 14px}
.kcol{flex:0 0 264px; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:9px}
.kcol-head{display:flex; align-items:center; gap:6px; padding:2px 2px 0}
.kcol-head .name{font-family:"Archivo"; font-weight:600; font-size:12.5px}
.kcol-head .cnt{margin-left:auto; font-size:11px; color:var(--text-muted); background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:0 7px}
.kcol-sla{font-size:10px; color:var(--text-faint); letter-spacing:.03em}
.kcard{background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--stripe,var(--border-strong));
  border-radius:9px; padding:10px; cursor:pointer; display:flex; flex-direction:column; gap:7px}
.kcard:hover{box-shadow:var(--shadow); transform:translateY(-1px)}
.kcard .nm{font-weight:600; font-size:13px}
.kcard .po{font-size:11.5px; color:var(--text-muted)}
.kcard .chips{display:flex; gap:5px; flex-wrap:wrap}
.kempty{font-size:11.5px; color:var(--text-faint); text-align:center; padding:14px 0}

/* ---------- drawer ---------- */
.drawer-backdrop{position:fixed; inset:0; background:rgba(12,18,14,.42); z-index:60}
.drawer{position:fixed; top:0; right:0; height:100vh; width:min(520px,94vw); background:var(--surface);
  border-left:1px solid var(--border); z-index:61; display:flex; flex-direction:column; box-shadow:var(--shadow);
  animation:slideIn .2s ease}
@keyframes slideIn{from{transform:translateX(20px); opacity:.4}to{transform:none; opacity:1}}
.drawer-head{padding:16px 18px; border-bottom:1px solid var(--border)}
.drawer-body{overflow:auto; padding:16px 18px; flex:1}
.tabs{display:flex; gap:2px; border-bottom:1px solid var(--border); padding:0 18px; overflow-x:auto}
.tabs button{border:0; background:none; padding:9px 10px; font-size:12.5px; font-weight:600; color:var(--text-muted);
  cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap}
.tabs button.active{color:var(--text); border-bottom-color:var(--accent)}

.timeline{display:flex; flex-direction:column; gap:0}
.tl-item{display:grid; grid-template-columns:24px 1fr; gap:10px; padding-bottom:14px; position:relative}
.tl-item::before{content:""; position:absolute; left:11px; top:20px; bottom:0; width:1px; background:var(--border)}
.tl-item:last-child::before{display:none}
.tl-dot{width:22px; height:22px; border-radius:50%; background:var(--surface-2); border:1px solid var(--border);
  display:grid; place-items:center; font-size:10px}
.tl-body .t{font-size:12.5px}
.tl-body .m{font-size:11px; color:var(--text-faint)}

.stage-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border)}
.stage-row:last-child{border-bottom:0}
.stage-ix{width:20px; height:20px; border-radius:50%; font-size:10px; display:grid; place-items:center;
  background:var(--surface-2); border:1px solid var(--border); color:var(--text-muted); flex:none}
.stage-row.done .stage-ix{background:var(--good-soft); color:var(--good); border-color:transparent}
.stage-row.now .stage-ix{background:var(--accent); color:var(--accent-contrast); border-color:transparent}
.stage-row .snm{font-size:13px; font-weight:500}
.stage-row .sm{font-size:11px; color:var(--text-faint)}

.toast-root{position:fixed; right:16px; bottom:16px; z-index:80; display:flex; flex-direction:column; gap:8px}
.toast{background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent);
  border-radius:9px; padding:10px 14px; font-size:12.5px; box-shadow:var(--shadow); max-width:320px;
  animation:slideIn .18s ease}

.seg{display:flex; gap:2px; background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:3px; flex-wrap:wrap}
.seg button{border:0; background:none; padding:6px 11px; border-radius:6px; font-size:12px; font-weight:600; color:var(--text-muted); cursor:pointer}
.seg button.active{background:var(--surface); color:var(--text); box-shadow:var(--shadow-sm)}

.bar-row{display:grid; grid-template-columns:170px 1fr 44px; gap:10px; align-items:center; font-size:12px; padding:5px 0}
.bar-track{height:9px; background:var(--surface-2); border-radius:999px; overflow:hidden}
.bar-fill{height:100%; background:var(--accent); border-radius:999px}

.dz{border:1.5px dashed var(--border-strong); border-radius:12px; padding:28px; text-align:center; color:var(--text-muted);
  background:var(--surface-2); cursor:pointer}
.dz:hover{border-color:var(--accent); color:var(--text)}
.progress{height:8px; background:var(--surface-2); border-radius:999px; overflow:hidden; margin-top:12px}
.progress > i{display:block; height:100%; background:var(--accent); width:0; transition:width .1s linear}

.mask{font-family:"IBM Plex Mono"; letter-spacing:1px; color:var(--text-faint)}
.lock-note{font-size:11px; color:var(--text-faint); display:inline-flex; gap:4px; align-items:center}

.divider{height:1px; background:var(--border); margin:16px 0}
.list-reset{list-style:none; margin:0; padding:0}

@media (max-width:980px){
  .cols-4{grid-template-columns:repeat(2,1fr)} .cols-3{grid-template-columns:repeat(2,1fr)}
  .form-grid{grid-template-columns:1fr} .cols-2{grid-template-columns:1fr}
}
@media (max-width:880px){
  #app{grid-template-columns:1fr}
  .sidebar{position:fixed; left:0; top:0; transform:translateX(-100%); transition:transform .2s; width:250px}
  .sidebar.open{transform:none}
  .menu-btn{display:grid}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s !important; transition-duration:.001s !important}
}
</style>

<div id="app"></div>
<div id="drawerRoot"></div>
<div class="toast-root" id="toastRoot"></div>

<script>
"use strict";
/* ============================================================
   e-Recruitment RPG — preview klik-able, data dummy, tanpa backend
   ============================================================ */

var TODAY = new Date(2026,7,31); // 31 Agu 2026
var BULAN = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
function iso(d){ return d.toISOString().slice(0,10); }
function daysAgo(n){ var d=new Date(TODAY); d.setDate(d.getDate()-n); return iso(d); }
function daysFwd(n){ var d=new Date(TODAY); d.setDate(d.getDate()+n); return iso(d); }
function fmtDate(s){ if(!s) return "–"; var d=new Date(s); if(isNaN(d)) return s;
  return d.getDate()+" "+BULAN[d.getMonth()]+" "+d.getFullYear(); }
function fmtDateTime(s){ if(!s) return "–"; var d=new Date(s); if(isNaN(d)) return s;
  var hh=("0"+d.getHours()).slice(-2), mm=("0"+d.getMinutes()).slice(-2);
  return fmtDate(s)+" · "+hh+":"+mm; }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function rp(n){ if(n==null||n==="") return "–"; return "Rp "+Number(n).toLocaleString("id-ID"); }
function uid(p){ return p+"-"+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

/* ---------------- referensi / master ---------------- */
/* M_STAGE — bisa ditambah/nonaktifkan admin. `sistem:true` = tahap inti, tak bisa dihapus. */
var SEED_STAGES = [
  {id:"SOURCING",     nama:"Sourcing",                  tipe:"SCREENING", sistem:true, aktif:true},
  {id:"SCREENING_CV", nama:"Screening CV",              tipe:"SCREENING", sistem:true, aktif:true},
  {id:"KONTAK_WA",    nama:"Kontak Kandidat",           tipe:"KONTAK",    sistem:true, aktif:true},
  {id:"INT_HR",       nama:"Interview HR",              tipe:"INTERVIEW", sistem:true, aktif:true},
  {id:"FORM_PELAMAR", nama:"Pengisian Form Pelamar",    tipe:"FORM",      sistem:true, aktif:true},
  {id:"PSIKOTES",     nama:"Psikotes",                  tipe:"TEST",      sistem:false,aktif:true},
  {id:"INT_USER",     nama:"Interview User",            tipe:"INTERVIEW", sistem:true, aktif:true},
  {id:"INT_BOD",      nama:"Interview BOD",             tipe:"INTERVIEW", sistem:false,aktif:true},
  {id:"OFFER",        nama:"Penawaran & Negosiasi",     tipe:"OFFER",     sistem:true, aktif:true},
  {id:"ONBOARD",      nama:"Onboarding & Pemberkasan",  tipe:"ONBOARD",   sistem:true, aktif:true},
  {id:"TES_TEKNIS",   nama:"Tes Teknis / Praktik",      tipe:"TEST",      sistem:false,aktif:true},
  {id:"MCU",          nama:"Medical Check-Up",          tipe:"TEST",      sistem:false,aktif:true},
  {id:"REF_CHECK",    nama:"Reference Check",           tipe:"SCREENING", sistem:false,aktif:true}
];
/* tipe_tahap = sumbu tetap untuk report lintas flow (lihat catatan dashboard) */
var TIPE_TAHAP = [
  {id:"SCREENING", label:"Screening"},   {id:"KONTAK",   label:"Kontak"},
  {id:"FORM",      label:"Form"},        {id:"TEST",     label:"Tes"},
  {id:"INTERVIEW", label:"Interview"},   {id:"OFFER",    label:"Offer"},
  {id:"ONBOARD",   label:"Onboarding"}
];
var STAGES = SEED_STAGES;   /* alias: kode lama masih pakai STAGES */
function allStages(){ return (typeof DB!=="undefined" && DB && DB.stages) ? DB.stages : SEED_STAGES; }
function stageById(id){ return allStages().filter(function(x){return x.id===id;})[0]; }

/* ---- pembuat lamaran generik ---- */
function normWa(raw){ var d=String(raw).replace(/[^0-9]/g,""); if(d.indexOf("0")===0) d="62"+d.slice(1);
  if(d.indexOf("62")!==0) d="62"+d; return d; }

function buildApp(db, spec){
  // spec: {nama,wa,email,kota,pendidikan,lahir, reqId, sampai(stageId), status, intake, channel, score, hired, note}
  var req = db.requisitions.filter(function(r){return r.id===spec.reqId;})[0];
  var flow = flowById(req.flow);
  var sIdx = flow.stages.indexOf(spec.sampai);
  if(sIdx<0) sIdx = flow.stages.length-1;
  var kid = uid("C"), aid = uid("APP");
  var totalSpan = 3 + sIdx*3 + Math.floor(Math.random()*3);
  var startDay = totalSpan;
  db.candidates.push({
    id:kid, nama:spec.nama, email:spec.email||(spec.nama.split(" ")[0].toLowerCase()+"@mail.com"),
    waRaw:spec.wa, waNormal:normWa(spec.wa), lahir:spec.lahir||"1996-04-11",
    pendidikan:spec.pendidikan||"S1", kota:spec.kota||"Jakarta", blacklist:false,
    consentPada:daysAgo(startDay), consentVersi:"v1.0",
    talentPool:!!spec.talentPool, retensiSampai:daysFwd(spec.status==="Rejected"?300:365)
  });
  var stages=[], history=[], contacts=[], interviews=[], psikotes=[], offer=null, bank=null, docs=[];
  var terminal = ["Rejected","Withdrawn","Offer_Declined","No_Show","Hired","Talent_Pool"].indexOf(spec.status)>=0;
  var d = startDay;
  for(var i=0;i<flow.stages.length;i++){
    var st = flow.stages[i];
    var row = {id:uid("AS"), stageId:st, urutan:i+1, pic:PIC_DEFAULT[st], remark:null, catatan:null, sisipan:false};
    if(i < sIdx){
      row.status="Lulus"; row.mulai=daysAgo(d); d-=3; row.selesai=daysAgo(d+1);
      history.push({waktu:daysAgo(d+1)+"T10:00:00", jenis:"STAGE_CHANGE", ke:st,
        deskripsi:"Lulus tahap "+stageName(st), oleh:PIC_DEFAULT[st]});
    } else if(i === sIdx){
      if(terminal && spec.status!=="Hired"){
        row.status = "Tidak_Lulus"; row.mulai=daysAgo(d); row.selesai=daysAgo(Math.max(1,d-2));
      } else if(spec.status==="Hired"){
        row.status="Lulus"; row.mulai=daysAgo(d); row.selesai=daysAgo(Math.max(1,d-2));
      } else {
        row.status="Berjalan"; row.mulai=daysAgo(d);
      }
    } else {
      row.status="Belum";
    }
    stages.push(row);
  }
  // kontak jika sudah melewati / berada di KONTAK_WA
  if(flow.stages.indexOf("KONTAK_WA")>=0 && flow.stages.indexOf("KONTAK_WA")<=sIdx){
    var att = spec.status==="Unreachable" ? flow.maks_kontak : (1+Math.floor(Math.random()*2));
    for(var k=1;k<=att;k++){
      var last = (k===att);
      contacts.push({id:uid("K"), upaya:k, metode:"WA", waktu:daysAgo(startDay-6-k)+"T09:30:00",
        hasil: (spec.status==="Unreachable") ? "Tidak_Respon" : (last?"Respon":"Tidak_Respon"),
        catatan: last && spec.status!=="Unreachable" ? "Kandidat konfirmasi lanjut proses." : "Belum ada balasan.",
        oleh:"Sinta"});
    }
  }
  if(spec.status==="Hired"){
    history.push({waktu:daysAgo(2)+"T09:00:00", jenis:"STATUS_CHANGE", statusKe:"Hired",
      deskripsi:"Join sesuai jadwal", oleh:"Sinta"});
  } else if(terminal){
    history.push({waktu:daysAgo(Math.max(1,d-1))+"T14:00:00", jenis:"STATUS_CHANGE", statusKe:spec.status,
      deskripsi: spec.note || (stGlobal(spec.status).label), oleh:"Sinta"});
  }
  db.applications.push({
    id:aid, kandidatId:kid, reqId:spec.reqId, flowId:req.flow,
    currentStage: spec.sampai, status: spec.status,
    intake: spec.intake||"IMPORT_FILE", channel: spec.channel||"JS",
    screeningScore: spec.score!=null?spec.score:(60+Math.floor(Math.random()*35)),
    screeningMethod: spec.method||"AI",
    tglLamar: daysAgo(startDay),
    stages:stages, history:history, contacts:contacts, interviews:interviews,
    psikotes:psikotes, offer:offer, bank:bank, docs:docs
  });
  return db.applications[db.applications.length-1];
}

var KEY = "rpg_erecruit_v1";
var DB, state;

function loadDB(){
  try{ var raw = localStorage.getItem(KEY); if(raw){ return JSON.parse(raw); } }catch(e){}
  return null;
}
function saveDB(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }
function resetDB(){ try{ localStorage.removeItem(KEY); }catch(e){} location.reload(); }

function loadState(){
  var s = {role:"HR_ADMIN", pipelineReq:"R1", pipelineFilter:"aktif", intakeTab:"import",
           drawerApp:null, drawerTab:"timeline", reqFilter:"", masterTab:"flow", masterFlow:"HQ_MANAGER",
           importPreview:false, bulkDone:false};
  try{ var raw = localStorage.getItem(KEY+"_st"); if(raw){ s = Object.assign(s, JSON.parse(raw)); } }catch(e){}
  s.drawerApp=null; // jangan buka drawer saat reload
  return s;
}
function saveState(){ try{ localStorage.setItem(KEY+"_st", JSON.stringify({role:state.role})); }catch(e){} }

/* theme toggle */
function initTheme(){
  var t=null; try{ t=localStorage.getItem(KEY+"_theme"); }catch(e){}
  if(t){ document.documentElement.setAttribute("data-theme", t); }
}
function toggleTheme(){
  var cur=document.documentElement.getAttribute("data-theme");
  var next = cur==="dark" ? "light" : (cur==="light" ? "dark" :
    (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "light":"dark"));
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem(KEY+"_theme", next); }catch(e){}
  render();
}

   HELPERS
   ============================================================ */
function can(perm, ownerCheckPassed){
  var m = PERM[perm]; if(!m) return false;
  var v = m[state.role];
  if(v===true) return true;
  if(v==="own") return ownerCheckPassed===true;
  return false;
}
function role(){ return ROLES.filter(function(r){return r.id===state.role;})[0]; }
function candById(id){ return DB.candidates.filter(function(c){return c.id===id;})[0]; }
function appById(id){ return DB.applications.filter(function(a){return a.id===id;})[0]; }
function reqById(id){ return DB.requisitions.filter(function(r){return r.id===id;})[0]; }
function approvalsFor(reqId){ return DB.approvals.filter(function(a){return a.reqId===reqId;})
  .sort(function(a,b){return a.putaran-b.putaran;}); }
function appsForReq(reqId){ return DB.applications.filter(function(a){return a.reqId===reqId;}); }
function dokById(id){ return DOKUMEN.filter(function(d){return d.id===id;})[0]; }

function reqVisible(r){
  if(state.role==="USER_DEPT") return r.pemohon===role().orang;
  return true;
}
function ownReqApp(a){
  var r=reqById(a.reqId);
  if(state.role==="USER_DEPT"||state.role==="BOD") return r && r.pemohon===role().orang;
  return true;
}

function toast(msg){
  var host=document.getElementById("toastRoot");
  var t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  host.appendChild(t);
  setTimeout(function(){ t.style.transition="opacity .3s"; t.style.opacity="0";
    setTimeout(function(){ t.remove(); }, 300); }, 2600);
}

function tagFor(statusId){
  var s=stGlobal(statusId);
  return '<span class="tag tag--'+s.tag+'"><span class="dot"></span>'+esc(s.label)+'</span>';
}
function reqStatusTag(st){
  var map={Draft:"",Diajukan:"info",Menunggu_BOD:"hold",Approved:"good",Sourcing:"info",
    Sourcing_Ulang:"warn",Terpenuhi_Sebagian:"hold",Terpenuhi:"good",Dibatalkan:"crit",Kadaluarsa:""};
  return '<span class="tag tag--'+(map[st]||"")+'">'+esc(String(st).replace(/_/g," "))+'</span>';
}
function urgensiTag(u){
  var m={Tinggi:"crit",Sedang:"warn",Rendah:""};
  return '<span class="tag tag--'+(m[u]||"")+'">'+esc(u)+'</span>';
}
function stageDays(a){
  var cur = a.stages.filter(function(s){return s.stageId===a.currentStage;})[0];
  if(!cur||!cur.mulai) return 0;
  return daysBetween(cur.mulai, iso(TODAY));
}
function isActive(a){ return a.status==="In_Progress"||a.status==="On_Hold"||a.status==="Unreachable"; }

/* ============================================================
   RENDER SHELL + ROUTER
   ============================================================ */
var NAV = [
  {grup:"Utama", items:[
    {route:"dashboard", label:"Dashboard", ic:"▚"},
    {route:"requisition", label:"Requisition (MPR)", ic:"▤"},
    {route:"intake", label:"Intake Kandidat", ic:"⇥"},
    {route:"pipeline", label:"Pipeline Seleksi", ic:"▦"}
  ]},
  {grup:"Konfigurasi", items:[
    {route:"master", label:"Master Data", ic:"⚙"}
  ]}
];

function go(routeStr){ // routeStr like "pipeline" or "requisition/R1" or "#/requisition/R1"
  state.route = String(routeStr).replace(/^#\//,"");
  if(/^https?:|^file:/.test(location.protocol)){ try{ location.hash = "#/"+state.route; }catch(e){} }
  state.drawerApp=null;
  render();
  var sb=document.getElementById("sidebar"); if(sb) sb.classList.remove("open");
}
function currentRoute(){
  var h=(state.route || (location.hash||"").replace(/^#\//,"") || "dashboard");
  var parts=h.split("/");
  return {name:parts[0]||"dashboard", arg:parts[1]||null};
}

function navCount(route){
  if(route==="requisition"){
    return DB.requisitions.filter(function(r){ return reqVisible(r) &&
      ["Diajukan","Menunggu_BOD","Approved","Sourcing","Sourcing_Ulang","Terpenuhi_Sebagian"].indexOf(r.status)>=0; }).length;
  }
  if(route==="pipeline"){
    return DB.applications.filter(function(a){ return ownReqApp(a) && isActive(a); }).length;
  }
  return null;
}

function shell(){
  var rt=currentRoute();
  var nav = NAV.map(function(g){
    return '<div class="nav-group"><div class="eyebrow">'+g.grup+'</div>'+
      g.items.map(function(it){
        var c=navCount(it.route);
        return '<button class="nav-item'+(rt.name===it.route?' active':'')+'" data-nav="'+it.route+'">'+
          '<span class="ic">'+it.ic+'</span><span>'+it.label+'</span>'+
          (c!=null?'<span class="badge-count">'+c+'</span>':'')+'</button>';
      }).join('')+'</div>';
  }).join('');

  var roleBtns = ROLES.map(function(r){
    return '<button class="'+(state.role===r.id?'active':'')+'" data-role="'+r.id+'" title="'+r.nama+' — '+r.orang+'">'+r.nama+'</button>';
  }).join('');

  return ''+
  '<aside class="sidebar" id="sidebar">'+
    '<div class="brand"><div class="brand-mark">R</div>'+
      '<div><div class="brand-name">e-Recruitment</div><div class="brand-sub">Ratu Pertiwi Group</div></div>'+
    '</div>'+
    nav +
    '<div style="margin-top:22px;padding:10px 8px;border-top:1px solid var(--border)">'+
      '<div class="eyebrow" style="margin-bottom:6px">Preview</div>'+
      '<p class="faint" style="font-size:11px;line-height:1.45">Semua data di halaman ini <b>dummy</b>. Perubahan tersimpan sementara di browser Anda.</p>'+
      '<button class="btn btn--sm btn--ghost" data-act="reset" style="margin-top:8px">↻ Reset data</button>'+
    '</div>'+
  '</aside>'+
  '<div class="main">'+
    '<header class="topbar">'+
      '<button class="icon-btn menu-btn" data-act="menu">☰</button>'+
      '<span class="env-pill">Preview · Data Dummy</span>'+
      '<span class="topbar-spacer"></span>'+
      '<span class="faint" style="font-size:11px">Masuk sebagai</span>'+
      '<div class="role-switch">'+roleBtns+'</div>'+
      '<button class="icon-btn" data-act="theme" title="Ganti tema">◐</button>'+
    '</header>'+
    '<div id="view"></div>'+
  '</div>';
}

function render(){
  var app=document.getElementById("app");
  app.innerHTML = shell();
  var rt=currentRoute();
  var view=document.getElementById("view");
  var html="";
  if(rt.name==="dashboard") html=viewDashboard();
  else if(rt.name==="requisition" && rt.arg) html=viewReqDetail(rt.arg);
  else if(rt.name==="requisition") html=viewReqList();
  else if(rt.name==="intake") html=viewIntake();
  else if(rt.name==="pipeline") html=viewPipeline();
  else if(rt.name==="master") html=viewMaster();
  else html=viewDashboard();
  view.innerHTML=html;
  renderDrawer();
  bindDynamic();
}

/* delegasi klik global */
document.addEventListener("click", function(e){
  var t=e.target.closest("[data-nav],[data-role],[data-act],[data-link],[data-openapp],[data-tab],[data-dtab],[data-mtab]");
  if(!t) return;
  if(t.dataset.nav){ go(t.dataset.nav); return; }
  if(t.dataset.role){ state.role=t.dataset.role; saveState();
    // pastikan pipelineReq masih boleh dilihat
    var pr=reqById(state.pipelineReq);
    if(!pr || (state.role==="USER_DEPT" && pr.pemohon!==role().orang)){
      var ok=DB.requisitions.filter(function(r){return reqVisible(r);})[0];
      state.pipelineReq = ok?ok.id:null;
    }
    state.drawerApp=null; render(); return; }
  if(t.dataset.link){ go(t.dataset.link); return; }
  if(t.dataset.openapp!=null){ state.drawerApp=t.dataset.openapp; state.drawerTab="timeline"; render(); return; }
  if(t.dataset.tab){ state.intakeTab=t.dataset.tab; state.importPreview=false; state.bulkDone=false; render(); return; }
  if(t.dataset.dtab){ state.drawerTab=t.dataset.dtab; render(); return; }
  if(t.dataset.mtab){ state.masterTab=t.dataset.mtab; render(); return; }
  if(t.dataset.act){ handleAct(t.dataset.act, t); return; }
});
window.addEventListener("hashchange", function(){
  var h=(location.hash||"").replace(/^#\//,"");
  if(h && h!==state.route){ state.route=h; state.drawerApp=null; render(); }
});

   VIEW: DASHBOARD
   ============================================================ */
function viewDashboard(){
  var openReq = DB.requisitions.filter(function(r){ return reqVisible(r) &&
    ["Diajukan","Menunggu_BOD","Approved","Sourcing","Sourcing_Ulang","Terpenuhi_Sebagian"].indexOf(r.status)>=0; });
  var apps = DB.applications.filter(ownReqApp);
  var aktif = apps.filter(isActive);
  var hiredBln = apps.filter(function(a){ return a.status==="Hired"; });
  var lamaProses = aktif.length ? Math.round(aktif.reduce(function(s,a){ return s+daysBetween(a.tglLamar, iso(TODAY)); },0)/aktif.length) : 0;
  var withKep = DB.approvals.filter(function(a){ return a.tglKeputusan; });
  var tungguApproval = withKep.length ? Math.round(withKep.reduce(function(s,a){ return s+daysBetween(a.diajukan,a.tglKeputusan); },0)/withKep.length) : 0;

  // funnel: berapa lamaran (aktif+selesai) yang pernah mencapai tiap tahap
  var funnel = STAGES.map(function(st){
    var n = apps.filter(function(a){
      var f=flowById(a.flowId); var fi=f.stages.indexOf(st.id); if(fi<0) return false;
      var ci=f.stages.indexOf(a.currentStage);
      var reached = ci>=fi || a.status==="Hired";
      var passedRow = a.stages.filter(function(s){return s.stageId===st.id && (s.status==="Lulus"||s.status==="Berjalan");}).length>0;
      return reached || passedRow;
    }).length;
    return {nama:st.nama, n:n};
  }).filter(function(x){ return x.n>0; });
  var fmax = Math.max.apply(null, funnel.map(function(x){return x.n;}).concat([1]));

  // aging
  var aging = aktif.slice().map(function(a){ return {a:a, d:stageDays(a)}; })
    .sort(function(x,y){ return y.d-x.d; }).slice(0,7);

  // pipeline per flow
  var perFlow = FLOWS.map(function(f){
    var n = aktif.filter(function(a){ return a.flowId===f.id; }).length;
    return {nama:f.nama, n:n};
  });

  return '<div class="view">'+
    '<div class="page-head"><div class="grow"><h1>Dashboard Rekrutmen</h1>'+
      '<div class="sub">Ringkasan aktivitas — sudut pandang <b>'+esc(role().nama)+' ('+esc(role().orang)+')</b>. Angka funnel teratas sebagian diinput manual dari portal.</div></div></div>'+

    '<div class="grid cols-4" style="margin-bottom:16px">'+
      stat("Requisition terbuka", openReq.length, openReq.filter(function(r){return r.status==="Menunggu_BOD";}).length+" menunggu BOD")+
      stat("Kandidat aktif", aktif.length, aktif.filter(function(a){return a.status==="On_Hold";}).length+" di-hold, "+aktif.filter(function(a){return a.status==="Unreachable";}).length+" unreachable")+
      stat("Diterima (Hired)", hiredBln.length, "kandidat join")+
      stat("Rata-rata lama proses", lamaProses+" hr", "dari tanggal lamar · tunggu approval "+tungguApproval+" hr")+
    '</div>'+

    '<div class="grid cols-2">'+
      '<div class="card card-pad">'+
        '<div class="between" style="margin-bottom:10px"><h3>Funnel rekrutmen</h3><span class="eyebrow">Semua requisition</span></div>'+
        funnel.map(function(x){
          return '<div class="bar-row"><span class="muted">'+esc(x.nama)+'</span>'+
            '<span class="bar-track"><span class="bar-fill" style="width:'+Math.max(4,Math.round(x.n/fmax*100))+'%"></span></span>'+
            '<span class="num" style="text-align:right">'+x.n+'</span></div>';
        }).join('')+
      '</div>'+
      '<div class="card card-pad">'+
        '<div class="between" style="margin-bottom:10px"><h3>Kandidat paling lama di tahap</h3><span class="eyebrow">SLA aging</span></div>'+
        '<div class="tbl-wrap" style="border:0">'+
        '<table class="tbl"><thead><tr><th>Kandidat</th><th>Tahap</th><th style="text-align:right">Hari</th></tr></thead><tbody>'+
        (aging.length? aging.map(function(x){
          var f=flowById(x.a.flowId); var fs=f.stages.indexOf(x.a.currentStage);
          var sla = SLA_DEFAULT[x.a.currentStage]||99;
          var over = x.d>sla;
          return '<tr class="clickable" data-openapp="'+x.a.id+'"><td>'+esc(candById(x.a.kandidatId).nama)+'</td>'+
            '<td>'+esc(stageName(x.a.currentStage))+'</td>'+
            '<td style="text-align:right"><span class="tag tag--'+(over?"warn":"")+'">'+x.d+' hr</span></td></tr>';
        }).join(''):'<tr><td colspan="3" class="faint">Tidak ada kandidat aktif.</td></tr>')+
        '</tbody></table></div>'+
      '</div>'+
    '</div>'+

    '<div class="card card-pad" style="margin-top:16px">'+
      '<h3 style="margin-bottom:10px">Pipeline aktif per flow</h3>'+
      '<div class="grid cols-4">'+
      perFlow.map(function(x){ return '<div class="stat"><div class="k">'+esc(x.nama)+'</div><div class="v">'+x.n+'</div></div>'; }).join('')+
      '</div>'+
    '</div>'+

    '<div class="callout" style="margin-top:16px"><span class="ic">💬</span>'+
      '<div><b>Buat HR:</b> klik-klik semua menu di kiri, coba ganti peran di kanan atas, majukan kandidat antar tahap, catat keputusan BOD. '+
      'Kalau ada alur yang belum sesuai proses Anda, catat — nanti kita sesuaikan sebelum dibangun beneran.</div></div>'+
  '</div>';
}

function field(type,name,label,opts,val){
  var inner;
  if(type==="select"){
    inner='<select name="'+name+'">'+(opts||[]).map(function(o){
      var v=typeof o==="object"?o.v:o, l=typeof o==="object"?o.l:String(o).replace(/_/g," ");
      return '<option value="'+esc(v)+'"'+(String(v)===String(val)?' selected':'')+'>'+esc(l)+'</option>';
    }).join('')+'</select>';
  } else if(type==="textarea"){
    inner='<textarea name="'+name+'">'+esc(val||"")+'</textarea>';
  } else {
    inner='<input type="'+type+'" name="'+name+'" value="'+esc(val==null?"":val)+'">';
  }
  return '<label class="field"><label>'+esc(label)+'</label>'+inner+'</label>';
}

/* ============================================================
   VIEW: PIPELINE (kanban)
   ============================================================ */
function viewPipeline(){
  var reqs=DB.requisitions.filter(function(r){return reqVisible(r) && appsForReq(r.id).length>0;});
  if(reqs.length===0) return '<div class="view"><div class="page-head"><div class="grow"><h1>Pipeline Seleksi</h1></div></div><p class="faint">Belum ada kandidat pada requisition yang bisa Anda lihat.</p></div>';
  if(!state.pipelineReq || !reqById(state.pipelineReq) || reqs.filter(function(r){return r.id===state.pipelineReq;}).length===0){
    state.pipelineReq=reqs[0].id;
  }
  var req=reqById(state.pipelineReq);
  var flow=flowById(req.flow);
  var all=appsForReq(req.id);
  var filt=state.pipelineFilter;
  function pass(a){
    if(filt==="semua") return true;
    if(filt==="aktif") return isActive(a);
    if(filt==="hired") return a.status==="Hired";
    if(filt==="ditolak") return ["Rejected","Withdrawn","Offer_Declined","No_Show"].indexOf(a.status)>=0;
    return true;
  }
  var apps=all.filter(pass);

  var cols=flow.stages.map(function(st){
    var inCol=apps.filter(function(a){ return a.currentStage===st; });
    return {st:st, apps:inCol};
  });

  return '<div class="view wide">'+
    '<div class="page-head"><div class="grow"><h1>Pipeline Seleksi</h1>'+
      '<div class="sub">Kolom mengikuti <b>flow template</b> requisition. '+
      (flow.id==="MP_OUTLET"?'Flow MP/Outlet cuma 2 tahap — bandingkan dengan flow HQ Manager yang 10 tahap.':'')+'</div></div></div>'+

    '<div class="between" style="margin-bottom:14px">'+
      '<div class="row">'+
        '<select id="pipeReq" style="padding:8px 10px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);color:var(--text);font-weight:600">'+
          reqs.map(function(r){ return '<option value="'+r.id+'"'+(r.id===req.id?' selected':'')+'>'+esc(r.no+" — "+posById(r.posId).nama)+'</option>'; }).join('')+
        '</select>'+
        '<span class="tag tag--accent">'+esc(flow.nama)+'</span>'+
        '<span class="faint" style="font-size:12px">maks kontak '+flow.maks_kontak+'×</span>'+
      '</div>'+
      '<div class="seg">'+
        [["aktif","Aktif"],["semua","Semua"],["hired","Hired"],["ditolak","Ditolak"]].map(function(f){
          return '<button class="'+(filt===f[0]?'active':'')+'" data-act="pipe-filter" data-f="'+f[0]+'">'+f[1]+'</button>';
        }).join('')+
      '</div>'+
    '</div>'+

    '<div class="kanban">'+
    cols.map(function(c,ix){
      var sla=SLA_DEFAULT[c.st];
      var opsional=flow.opsional.indexOf(c.st)>=0;
      return '<div class="kcol">'+
        '<div class="kcol-head"><span class="stage-ix">'+(ix+1)+'</span>'+
          '<span class="name">'+esc(stageName(c.st))+'</span>'+
          (opsional?'<span class="tag" style="font-size:9px">opsional</span>':'')+
          '<span class="cnt">'+c.apps.length+'</span></div>'+
        '<div class="kcol-sla">SLA '+sla+' hari · PIC '+PIC_DEFAULT[c.st]+'</div>'+
        (c.apps.length? c.apps.map(function(a){ return kcard(a,flow); }).join('') : '<div class="kempty">—</div>')+
      '</div>';
    }).join('')+
    '</div>'+
  '</div>';
}

function kcard(a,flow){
  var c=candById(a.kandidatId);
  var d=stageDays(a);
  var sla=SLA_DEFAULT[a.currentStage]||99;
  var over=d>sla && isActive(a);
  var att=a.contacts.length;
  var stripe = {In_Progress:"var(--info)",On_Hold:"var(--hold)",Unreachable:"var(--warn)",Hired:"var(--good)",
    Rejected:"var(--crit)",Withdrawn:"var(--crit)",Offer_Declined:"var(--crit)",No_Show:"var(--crit)"}[a.status]||"var(--border-strong)";
  return '<div class="kcard" style="--stripe:'+stripe+'" data-openapp="'+a.id+'">'+
    '<div class="nm">'+esc(c.nama)+'</div>'+
    '<div class="po mono" style="font-size:10px">'+esc(a.id)+'</div>'+
    '<div class="chips">'+
      (a.screeningScore!=null?'<span class="tag">CV '+a.screeningScore+'</span>':'')+
      (flow.stages.indexOf("KONTAK_WA")>=0 && flow.stages.indexOf("KONTAK_WA")<=flow.stages.indexOf(a.currentStage) ?
        '<span class="tag'+(att>=flow.maks_kontak?' tag--warn':'')+'">kontak '+att+'/'+flow.maks_kontak+'</span>':'')+
      '<span class="tag'+(over?' tag--warn':'')+'">'+d+' hr</span>'+
      (a.status!=="In_Progress"? tagFor(a.status):'')+
    '</div>'+
  '</div>';
}

function renderDrawer(){
  var host=document.getElementById("drawerRoot");

  tabs.push(["dokumen","Dokumen"]);
  tabs.push(["offer","Offer"]);

  var body="";
  if(tab==="timeline") body=drawTimeline(a);
  else if(tab==="tahapan") body=drawTahapan(a,flow);
  else if(tab==="kontak") body=drawKontak(a,flow);
  else if(tab==="interview") body=drawInterview(a,flow);
  else if(tab==="psikotes") body=drawPsikotes(a);
  else if(tab==="dokumen") body=drawDokumen(a);
  else if(tab==="offer") body=drawOffer(a,flow);

  host.innerHTML=
    '<div class="drawer-backdrop" data-act="close-drawer"></div>'+
    '<aside class="drawer">'+
      '<div class="drawer-head">'+
        '<div class="between"><div>'+
          '<div class="row" style="gap:8px"><h2>'+esc(c.nama)+'</h2>'+tagFor(a.status)+'</div>'+
          '<div class="faint mono" style="font-size:11px;margin-top:2px">'+esc(a.id)+' · '+esc(req.no)+' · '+esc(posById(req.posId).nama)+'</div>'+
        '</div><button class="icon-btn" data-act="close-drawer">✕</button></div>'+
        '<div class="row" style="gap:6px;margin-top:10px">'+
          '<span class="tag tag--accent">'+esc(flow.nama)+'</span>'+
          '<span class="tag">'+esc(stageName(a.currentStage))+'</span>'+
          '<span class="tag">'+esc({FORM_PUBLIC:"Form Publik",IMPORT_FILE:"Import",MANUAL:"Manual",BULK_CV:"Bulk CV"}[a.intake]||a.intake)+'</span>'+
          '<span class="tag">'+esc(channelName(a.channel))+'</span>'+
        '</div>'+
        '<dl class="kv" style="margin-top:12px;grid-template-columns:96px 1fr">'+
          kv("WhatsApp", '<span class="mono">'+esc(c.waNormal)+'</span>')+
          kv("Email", esc(c.email))+
          kv("Domisili", esc(c.kota))+
          kv("Pendidikan", esc(c.pendidikan))+
          kv("Screening", a.screeningScore!=null? (a.screeningScore+" · "+a.screeningMethod) : "–")+
          kv("Tgl lamar", fmtDate(a.tglLamar))+
        '</dl>'+
      '</div>'+
      '<div class="tabs">'+tabs.map(function(t){ return '<button class="'+(tab===t[0]?'active':'')+'" data-dtab="'+t[0]+'">'+t[1]+'</button>'; }).join('')+'</div>'+
      '<div class="drawer-body">'+body+'</div>'+
    '</aside>';
}

function drawTimeline(a){
  var ic={STAGE_CHANGE:"▸",KONTAK:"☏",DOKUMEN:"▤",OFFER:"₊",STATUS_CHANGE:"◑",CATATAN:"✎"};
  var items=a.history.slice().sort(function(x,y){ return new Date(x.waktu)-new Date(y.waktu); });
  return '<div class="timeline">'+items.map(function(h){
    return '<div class="tl-item"><div class="tl-dot">'+(ic[h.jenis]||"·")+'</div>'+
      '<div class="tl-body"><div class="t">'+esc(h.deskripsi)+'</div>'+
      '<div class="m">'+fmtDateTime(h.waktu)+' · '+esc(h.oleh||"sistem")+'</div></div></div>';
  }).join('')+'</div>';
}

function drawTahapan(a,flow){
  var canAct = isActive(a) && (state.role==="HR_ADMIN"||state.role==="HR_SPV");
  var curIx=flow.stages.indexOf(a.currentStage);
  var list=a.stages.map(function(s,i){
    var cls = s.status==="Lulus"?"done":(s.status==="Berjalan"?"now":"");
    var stTag = s.status==="Lulus"?'<span class="tag tag--good">Lulus</span>':
      s.status==="Berjalan"?'<span class="tag tag--info">Berjalan</span>':
      s.status==="Tidak_Lulus"?'<span class="tag tag--crit">Tidak lulus</span>':
      s.status==="Dilewati"?'<span class="tag">Dilewati</span>':'<span class="tag">Belum</span>';
    return '<div class="stage-row '+cls+'"><span class="stage-ix">'+(i+1)+'</span>'+
      '<div style="flex:1"><div class="snm">'+esc(stageName(s.stageId))+
        (s.sisipan?' <span class="tag tag--talent" style="font-size:9px">sisipan</span>':'')+'</div>'+
        '<div class="sm">'+(s.mulai?fmtDate(s.mulai):'–')+(s.selesai?' → '+fmtDate(s.selesai):'')+
        (s.remark?' · '+esc(s.remark):'')+'</div>'+
        (s.catatan?'<div class="sm" style="color:var(--text-muted)">'+esc(s.catatan)+'</div>':'')+
      '</div>'+stTag+'</div>';
  }).join('');

  var actions="";
  if(canAct){
    var rmk=remarksFor(a.currentStage);
    actions='<div class="divider"></div>'+
      '<form data-form="advance" data-app="'+a.id+'">'+
        '<div class="eyebrow" style="margin-bottom:8px">Proses tahap: '+esc(stageName(a.currentStage))+'</div>'+
        '<label class="field"><label>Remark / hasil</label><select name="remark">'+
          rmk.map(function(r){ return '<option value="'+r.id+'">'+esc(r.label)+' — '+efekLabel(r)+'</option>'; }).join('')+
        '</select></label>'+
        field("textarea","catatan","Catatan (opsional)")+
        '<button class="btn btn--primary btn--sm" type="submit">Terapkan</button>'+
      '</form>'+
      '<form data-form="sisipan" data-app="'+a.id+'" style="margin-top:14px">'+
        '<div class="eyebrow" style="margin-bottom:8px">Tambah tahap sisipan (ad-hoc)</div>'+
        '<label class="field"><select name="stage">'+
          STAGES.filter(function(s){return flow.stages.indexOf(s.id)<0;}).map(function(s){ return '<option value="'+s.id+'">'+esc(s.nama)+'</option>'; }).join('')+
        '</select></label>'+
        '<button class="btn btn--sm" type="submit">+ Sisipkan setelah tahap sekarang</button>'+
      '</form>';
  } else if(isActive(a)){
    actions='<div class="callout" style="margin-top:14px"><span class="ic">🔒</span><div>Peran <b>'+esc(role().nama)+'</b> tidak memproses tahap. Login sebagai HR Admin / HR Spv untuk memajukan kandidat.</div></div>';
  }
  return list+actions;
}
function efekLabel(r){
  if(r.efek==="LANJUT") return "lanjut tahap berikut";
  if(r.efek==="ON_HOLD") return "status jadi On Hold";
  if(r.efek==="TOLAK") return r.unreachable?"status jadi Unreachable":"status jadi Ditolak";
  if(r.efek==="WITHDRAWN") return "status jadi Mundur";
  if(r.efek==="OFFER_DECLINED") return "status jadi Offer Ditolak";
  if(r.efek==="NO_SHOW") return "status jadi Gagal Join";
  if(r.efek==="HIRED") return "status jadi Diterima";
  return r.efek;
}

function drawKontak(a,flow){
  var canAct = isActive(a) && (state.role==="HR_ADMIN"||state.role==="HR_SPV");
  var maxed = a.contacts.length>=flow.maks_kontak;
  var lastNoResp = a.contacts.length && a.contacts[a.contacts.length-1].hasil!=="Respon";
  var rows = a.contacts.length? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Upaya</th><th>Metode</th><th>Waktu</th><th>Hasil</th></tr></thead><tbody>'+
    a.contacts.map(function(k){
      var tg=k.hasil==="Respon"?"good":(k.hasil==="Menolak"?"crit":"warn");
      return '<tr><td class="num">'+k.upaya+'</td><td>'+esc(k.metode)+'</td>'+
        '<td class="faint" style="font-size:12px">'+fmtDateTime(k.waktu)+'</td>'+
        '<td><span class="tag tag--'+tg+'">'+esc(k.hasil.replace("_"," "))+'</span></td></tr>'+
        (k.catatan?'<tr><td></td><td colspan="3" class="faint" style="font-size:12px">'+esc(k.catatan)+'</td></tr>':'');
    }).join('')+'</tbody></table></div>'
    : '<p class="faint">Belum ada upaya kontak.</p>';

  var warn = (maxed && lastNoResp && a.status!=="Unreachable") ?
    '<div class="callout callout--warn" style="margin-top:12px"><span class="ic">⚠</span><div>Sudah '+a.contacts.length+'× tanpa respons — batas flow ini '+flow.maks_kontak+'×. '+
    (canAct?'<button class="btn btn--sm btn--danger" data-act="mark-unreachable" data-app="'+a.id+'" style="margin-top:6px">Tandai Unreachable</button>':'')+'</div></div>' : '';

  var form = canAct ? '<div class="divider"></div><form data-form="log-kontak" data-app="'+a.id+'">'+
    '<div class="eyebrow" style="margin-bottom:8px">Catat kontak (upaya ke-'+(a.contacts.length+1)+')</div>'+
    '<div class="form-grid">'+
      field("select","metode","Metode",["WA","Telepon","Email"])+
      field("select","hasil","Hasil",[{v:"Respon",l:"Respon"},{v:"Tidak_Respon",l:"Tidak respon"},{v:"Nomor_Salah",l:"Nomor salah"},{v:"Menolak",l:"Menolak"}])+
    '</div>'+
    field("textarea","catatan","Catatan")+
    '<button class="btn btn--primary btn--sm" type="submit">Simpan</button>'+
  '</form>' : '';

  return rows+warn+form;
}

/* ============================================================
   AKSI (tombol data-act) + BINDING FORM
   ============================================================ */
function nextSeq(){ DB.seq=(DB.seq||100)+1; return DB.seq; }
function pushHist(a,obj){ obj.waktu=new Date().toISOString(); obj.oleh=obj.oleh||role().orang; a.history.push(obj); }

function handleAct(act, el){
  if(act==="menu"){ document.getElementById("sidebar").classList.toggle("open"); return; }
  if(act==="theme"){ toggleTheme(); return; }
  if(act==="reset"){ if(confirm("Reset semua data dummy ke kondisi awal?")) resetDB(); return; }
  if(act==="close-drawer"){ state.drawerApp=null; render(); return; }
  if(act==="new-mpr"){ openMprForm(); return; }
  if(act==="goto-pipe"){ state.pipelineReq=el.dataset.req; go("pipeline"); return; }

  if(act==="pipe-filter"){ state.pipelineFilter=el.dataset.f; render(); return; }

  if(act==="import-commit"){ commitImport(); return; }
  if(act==="import-cancel"){ state.importPreview=false; render(); return; }
  if(act==="bulk-run"){ runBulk(); return; }
  if(act==="bulk-save"){ state.bulkDone=false; toast("11 kandidat masuk Talent Pool (demo)."); render(); return; }

  if(act==="resubmit"){
    var rid=el.dataset.req; var ap=approvalsFor(rid);
    DB.approvals.push({id:uid("A"),reqId:rid,putaran:ap.length+1,diajukan:iso(TODAY),keputusan:"Pending",jumlah:0,tglKeputusan:null,oleh:null,catatan:null,lampiran:false,diinputOleh:role().orang});
    reqById(rid).status="Menunggu_BOD"; saveDB(); toast("Diajukan ulang ke BOD (putaran "+(ap.length+1)+")."); render(); return;
  }
  if(act==="mark-unreachable"){
    var a=appById(el.dataset.app); a.status="Unreachable";
    pushHist(a,{jenis:"STATUS_CHANGE",statusKe:"Unreachable",deskripsi:"Ditandai tidak dapat dihubungi (reversible)"});
    saveDB(); toast(candById(a.kandidatId).nama+" → Unreachable."); render(); return;
  }

  if(act==="pick-flow"){ state.masterFlow=el.dataset.flow; render(); return; }
  if(act==="flow-move"){
    var f=flowById(el.dataset.flow); var i=+el.dataset.i; var dir=+el.dataset.dir; var j=i+dir;
    if(j<0||j>=f.stages.length) return;
    var tmp=f.stages[i]; f.stages[i]=f.stages[j]; f.stages[j]=tmp;
    saveDB(); render(); return;
  }
  if(act==="flow-opsional"){
    var f2=flowById(el.dataset.flow); var st=el.dataset.st;
    var k=f2.opsional.indexOf(st);
    if(k>=0) f2.opsional.splice(k,1); else f2.opsional.push(st);
    saveDB(); render(); return;
  }
  if(act==="toggle-remark"){
    var r=REMARKS.filter(function(x){return x.id===el.dataset.rm;})[0]; r.aktif=!r.aktif; render(); return;
  }
}

function runBulk(){
  var bar=document.querySelector("#bulkBar > i"); if(!bar) return;
  var p=0; var t=setInterval(function(){
    p+=Math.random()*18; if(p>=100){ p=100; clearInterval(t); state.bulkDone=true; setTimeout(render,250); }
    bar.style.width=p+"%";
  },90);
}

  state.importPreview=false; saveDB();

/* ---- binding form & input tiap render ---- */
function bindDynamic(){
  // search MPR
  var rs=document.getElementById("reqSearch");
  if(rs) rs.oninput=function(){ state.reqFilter=rs.value; var v=document.getElementById("view");
    v.innerHTML=viewReqList(); bindDynamic(); var el=document.getElementById("reqSearch"); el.focus(); el.setSelectionRange(el.value.length,el.value.length); };

  // pipeline req select
  var pr=document.getElementById("pipeReq");
  if(pr) pr.onchange=function(){ state.pipelineReq=pr.value; render(); };

  // import pick fields -> remember
  document.querySelectorAll('[data-form="import-pick"] select').forEach(function(s){
    s.onchange=function(){ if(s.name==="channel") state.importChannel=s.value; if(s.name==="reqId") state.importReqId=s.value; };
    if(s.name==="channel") state.importChannel=s.value; if(s.name==="reqId") state.importReqId=s.value;
  });

  document.querySelectorAll("form[data-form]").forEach(function(f){
    f.addEventListener("submit", function(e){ e.preventDefault(); onSubmit(f); });
  });

  // flow maks kontak inline input
  document.querySelectorAll('[data-act="flow-maks"]').forEach(function(inp){
    inp.onchange=function(){ var f=flowById(inp.dataset.flow); f.maks_kontak=Math.max(1,+inp.value||1); saveDB(); toast("Maks kontak "+f.kode+" → "+f.maks_kontak+"×"); };
  });
}

function readForm(f){
  var o={}; Array.prototype.forEach.call(f.elements, function(el){
    if(!el.name) return;
    if(el.type==="checkbox") o[el.name]=el.checked;
    else o[el.name]=el.value;
  }); return o;
}

function onSubmit(f){
  var kind=f.dataset.form; var d=readForm(f);

  if(kind==="import-pick"){ state.importPreview=true; state.importChannel=d.channel; state.importReqId=d.reqId; render(); return; }

  if(kind==="manual-add" || kind==="public-apply"){
    if(kind==="public-apply" && !d.consent){ toast("Centang persetujuan data dulu."); return; }
    if(!d.nama){ toast("Nama wajib diisi."); return; }
    var reqId = kind==="public-apply" ? "R3" : d.reqId;
    var flow=flowById(reqById(reqId).flow);
    var app=buildApp(DB,{nama:d.nama,wa:d.wa||"08000000000",email:d.email,kota:d.kota,pendidikan:d.pendidikan,
      reqId:reqId, sampai:flow.stages[0], status:"In_Progress",
      intake: kind==="public-apply"?"FORM_PUBLIC":"MANUAL", channel:d.channel||"POR",
      talentPool: !!d.talentPool, score:null, method:"MANUAL"});
    app.tglLamar = d.tglLamar||iso(TODAY);
    saveDB();
    toast(kind==="public-apply" ? "Lamaran diterima. Terima kasih!" : d.nama+" ditambahkan.");
    if(kind==="manual-add"){ state.pipelineReq=reqId; go("pipeline"); return; }
    else render();
    return;
  }

  if(kind==="create-mpr"){
    if(!d.jobdesc){ toast("Isi job description dulu."); return; }
    var p=posById(d.posId);
    var n=nextSeq();
    var id=uid("R");
    var flowId = d.butuhBod && p.level!=="Manager" ? "HQ_STAFF_KRUSIAL" : p.flow;
    DB.requisitions.push({id:id, no:"MPR/2026/08/"+("00"+n).slice(-3), tgl:iso(TODAY), pemohon:role().orang, dept:p.dept, posId:d.posId,
      penempatan:d.penempatan, outlet:d.penempatan==="OUTLET"?(d.outlet||"Z-MKTR"):null,
      butuh:+d.butuh||1, disetujui:0, flow:flowId, statusKaryawan:d.statusKaryawan, alasan:d.alasan,
      targetJoin:d.targetJoin, urgensi:d.urgensi, pendidikan:d.pendidikan, pengalaman:+d.pengalaman||0,
      butuhPsikotes:!!d.butuhPsikotes, butuhBod:!!d.butuhBod,
      gajiMin:+d.gajiMin||null, gajiMax:+d.gajiMax||null, jobdesc:d.jobdesc, kualifikasi:d.kualifikasi||"", status:"Menunggu_BOD"});
    DB.approvals.push({id:uid("A"),reqId:id,putaran:1,diajukan:iso(TODAY),keputusan:"Pending",jumlah:0,tglKeputusan:null,oleh:null,catatan:null,lampiran:false,diinputOleh:role().orang});
    saveDB(); state.drawerApp=null;
    toast("MPR dibuat & diajukan ke BOD.");
    go("requisition/"+id); return;
  }

  if(kind==="record-appr"){
    var ap=DB.approvals.filter(function(x){return x.id===f.dataset.appr;})[0];
    ap.keputusan=d.keputusan; ap.jumlah=d.keputusan==="Rejected"?0:(+d.jumlah||0);
    ap.tglKeputusan=d.tglKeputusan||iso(TODAY); ap.oleh=d.oleh||"BOD"; ap.catatan=d.catatan; ap.lampiran=!!d.lampiran;
    var r=reqById(ap.reqId);
    if(d.keputusan==="Rejected"){ r.status="Menunggu_BOD"; }
    else { r.disetujui=ap.jumlah; r.status="Sourcing"; }
    saveDB(); toast("Keputusan BOD tersimpan."); render(); return;
  }

  var a = f.dataset.app ? appById(f.dataset.app) : null;

  if(kind==="advance"){
    var rm=REMARKS.filter(function(x){return x.id===d.remark;})[0];
    applyRemark(a, rm, d.catatan);
    saveDB(); render(); return;
  }
  if(kind==="sisipan"){
    var flow=flowById(a.flowId);
    var ci=a.stages.map(function(s){return s.stageId;}).indexOf(a.currentStage);
    a.stages.splice(ci+1,0,{id:uid("AS"),stageId:d.stage,urutan:0,status:"Belum",mulai:null,selesai:null,pic:PIC_DEFAULT[d.stage]||"HR",remark:null,catatan:"Tahap ad-hoc",sisipan:true});
    a.stages.forEach(function(s,i){s.urutan=i+1;});
    pushHist(a,{jenis:"CATATAN",deskripsi:"Tahap sisipan ditambahkan: "+stageName(d.stage)});
    saveDB(); toast("Tahap sisipan ditambahkan."); render(); return;
  }
  if(kind==="log-kontak"){
    a.contacts.push({id:uid("K"),upaya:a.contacts.length+1,metode:d.metode,waktu:new Date().toISOString(),hasil:d.hasil,catatan:d.catatan,oleh:role().orang});
    pushHist(a,{jenis:"KONTAK",deskripsi:"Kontak upaya ke-"+a.contacts.length+" ("+d.metode+") — "+d.hasil.replace("_"," ")});
    if(d.hasil==="Respon" && a.status==="Unreachable"){ a.status="In_Progress"; toast("Kandidat merespons → kembali In Progress."); }
    else toast("Kontak dicatat.");
    saveDB(); render(); return;
  }
  if(kind==="add-interview"){
    a.interviews.push({id:uid("IV"),stageId:d.stageId,tipe:d.tipe,jadwal:(d.jadwal||daysFwd(2))+"T10:00:00",lokasi:d.lokasi||"-",
      hasil:"Reschedule",skor:null,catatan:"Dijadwalkan.",selesai:null,
      peserta:(d.peserta||"").split(",").map(function(s){return {nama:s.trim(),peran:"HR"};}).filter(function(p){return p.nama;})});
    pushHist(a,{jenis:"CATATAN",deskripsi:"Interview "+stageName(d.stageId)+" dijadwalkan "+fmtDate(d.jadwal)});
    saveDB(); toast("Jadwal interview disimpan."); render(); return;
  }
  if(kind==="add-psikotes"){
    a.psikotes.push({id:uid("PT"),vendor:d.vendor||"DISC",tanggal:d.tanggal||iso(TODAY),skor:+d.skor||0,hasil:d.hasil,rekomendasi:d.rekomendasi,oleh:role().orang});
    pushHist(a,{jenis:"CATATAN",deskripsi:"Hasil psikotes "+d.vendor+" — "+d.hasil.replace("_"," ")+" (skor "+d.skor+")"});
    saveDB(); toast("Hasil psikotes disimpan."); render(); return;
  }
  if(kind==="make-offer"){
    a.offer={id:uid("OF"),gaji:+d.gaji||0,tglPenawaran:d.tglPenawaran||iso(TODAY),tglJoinSepakat:d.tglJoinSepakat,tglJoinAktual:null,status:"Nego",alasan:""};
    pushHist(a,{jenis:"OFFER",deskripsi:"Offer dibuat: "+rp(+d.gaji)});
    saveDB(); toast("Offer dibuat."); render(); return;
  }
  if(kind==="offer-status"){
    a.offer.status=d.status; a.offer.alasan=d.alasan||a.offer.alasan;
    pushHist(a,{jenis:"OFFER",deskripsi:"Status offer → "+d.status});
    if(d.status==="Diterima"){ toast("Offer diterima — lanjutkan ke Onboarding di tab Tahapan."); }
    if(d.status==="Ditolak"||d.status==="Batal"){ a.status="Offer_Declined"; pushHist(a,{jenis:"STATUS_CHANGE",statusKe:"Offer_Declined",deskripsi:"Offer "+d.status.toLowerCase()}); }
    saveDB(); render(); return;
  }
}

function applyRemark(a, rm, catatan){
  var flow=flowById(a.flowId);
  var stagesIds=a.stages.map(function(s){return s.stageId;});
  var ci=stagesIds.indexOf(a.currentStage);
  var cur=a.stages[ci];
  cur.remark=rm.label; if(catatan) cur.catatan=catatan;

  if(rm.efek==="LANJUT"){
    cur.status="Lulus"; cur.selesai=iso(TODAY);
    var ni=ci+1;
    if(ni<a.stages.length){
      var nx=a.stages[ni]; nx.status="Berjalan"; nx.mulai=iso(TODAY);
      a.currentStage=nx.stageId; a.status="In_Progress";
      pushHist(a,{jenis:"STAGE_CHANGE",ke:nx.stageId,deskripsi:"Lulus "+stageName(cur.stageId)+" → "+stageName(nx.stageId)+" ("+rm.label+")"});
    } else {
      a.status="Hired"; a.currentStage=cur.stageId;
      pushHist(a,{jenis:"STATUS_CHANGE",statusKe:"Hired",deskripsi:rm.label});
      bumpTerisi(a);
    }
    toast("Kandidat maju ke "+stageName(a.currentStage)+".");
  } else if(rm.efek==="ON_HOLD"){
    a.status="On_Hold";
    pushHist(a,{jenis:"STATUS_CHANGE",statusKe:"On_Hold",deskripsi:rm.label});
    toast("Status → Di Pertimbangkan.");
  } else if(rm.efek==="HIRED"){
    cur.status="Lulus"; cur.selesai=iso(TODAY); a.status="Hired";
    pushHist(a,{jenis:"STATUS_CHANGE",statusKe:"Hired",deskripsi:rm.label});
    bumpTerisi(a); toast("Kandidat Hired 🎉");
  } else {
    // TOLAK / WITHDRAWN / OFFER_DECLINED / NO_SHOW
    cur.status="Tidak_Lulus"; cur.selesai=iso(TODAY);
    var st = rm.unreachable ? "Unreachable" : (EFEK_STATUS[rm.efek]||"Rejected");
    a.status=st;
    pushHist(a,{jenis:"STATUS_CHANGE",statusKe:st,deskripsi:rm.label});
    toast("Status → "+stGlobal(st).label+".");
  }
}
function bumpTerisi(a){
  var r=reqById(a.reqId);
  var terisi=appsForReq(r.id).filter(function(x){return x.status==="Hired";}).length;
  if(terisi>=r.disetujui && r.disetujui>0) r.status="Terpenuhi";
  else if(terisi>0) r.status="Terpenuhi_Sebagian";
}

   BOOT

initTheme();
DB = loadDB() || seed();
state = loadState();
state.route = (location.hash||"").replace(/^#\//,"") || "dashboard";
render();
